<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基金自算估值</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; }
  header { background: #1f3a5f; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  button { padding: 9px 16px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font-size: 14px; cursor: pointer; }
  button.secondary { background: #e8ebef; color: #333; }
  button.danger { background: #d33; padding: 5px 10px; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 6px; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  .up { color: #d33; font-weight: 600; } .down { color: #0a8a4a; font-weight: 600; }
  .muted { color: #888; font-size: 12px; }
  .err { color: #d33; font-size: 13px; min-height: 18px; }
  .search-results button { margin: 4px 4px 0 0; background: #eef3ff; color: #1f3a5f; border: 1px solid #c9d8f5; }
  tr.changed td { background: #fff7cc; }
  .badge { display: inline-block; background: #f5b301; color: #222; font-size: 11px; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  tr.group-row td { background: #eef3ff; color: #1f3a5f; font-weight: 600; text-align: left; }
  button.mini { padding: 4px 8px; font-size: 13px; background: #e8ebef; color: #333; margin-right: 4px; }
  button.mini:disabled { opacity: .35; cursor: default; }
  select.cat { padding: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; max-width: 130px; }
  .legend { color: #888; font-size: 12px; margin-bottom: 8px; }
  #countdown { color: #888; font-size: 13px; }
  footer { text-align: center; color: #999; font-size: 12px; padding: 16px; }
  @media (max-width: 720px) { th.hide-m, td.hide-m { display: none; } table { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <h1>基金自算估值</h1>
  <span id="userbox" class="muted" style="color:#cfe0f5"></span>
</header>
<main>
  <div id="auth" class="card" style="display:none">
    <h3 id="auth-title">登录</h3>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <div class="err" id="auth-err"></div>
    <div class="row">
      <button id="auth-btn">登录</button>
      <button class="secondary" id="auth-switch">没有账号？去注册</button>
    </div>
  </div>

  <div id="dash" style="display:none">
    <div class="card">
      <div class="row">
        <input id="q" placeholder="搜索基金代码或名称，如 005827">
        <button id="search-btn">搜索</button>
        <button class="secondary" id="refresh-btn">刷新估值</button>
        <span id="countdown">下次自动刷新：60s</span>
        <button class="secondary" id="logout-btn">退出</button>
      </div>
      <div class="search-results" id="results"></div>
      <div class="err" id="dash-err"></div>
    </div>
    <div class="card" style="overflow-x:auto">
      <div class="legend">黄色高亮＋「更新」标记 = 本次刷新数据有变化；无变化时标记自动消失。</div>
      <table>
        <thead><tr>
          <th>基金</th><th>昨日净值</th><th>自算估值</th><th>估算涨跌</th><th>分类</th>
          <th class="hide-m">持仓覆盖</th><th class="hide-m">持仓报告期</th><th class="hide-m">行情时间</th><th>顺序/操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="muted" id="empty-tip">列表为空，先搜索添加基金。估值每 60 秒自动刷新。</div>
    </div>
  </div>
</main>
<footer>自算估值，仅供参考，以基金公司公布净值为准。估值基于最新披露前十大重仓股实时涨跌加权计算，与实际净值可能有偏差。</footer>
<script>
const $ = id => document.getElementById(id);
let mode = "login", timer = null;
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("请求失败 " + r.status));
  return data;
}
let countdownTimer = null, countdownLeft = 60;
function resetCountdown() {
  countdownLeft = 60;
  const el = $("countdown"); if (el) el.textContent = "下次自动刷新：" + countdownLeft + "s";
  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdownLeft = Math.max(0, countdownLeft - 1);
    const e2 = $("countdown"); if (e2) e2.textContent = "下次自动刷新：" + countdownLeft + "s";
  }, 1000);
}
function showAuth() { $("auth").style.display = ""; $("dash").style.display = "none"; clearInterval(timer); clearInterval(countdownTimer); prevSnapshot = null; }
function showDash(user) {
  $("auth").style.display = "none"; $("dash").style.display = "";
  $("userbox").textContent = user;
  prevSnapshot = null;
  loadEstimates();
  clearInterval(timer); timer = setInterval(loadEstimates, 60000);
}
$("auth-switch").onclick = () => {
  mode = mode === "login" ? "register" : "login";
  $("auth-title").textContent = mode === "login" ? "登录" : "注册";
  $("auth-btn").textContent = mode === "login" ? "登录" : "注册";
  $("auth-switch").textContent = mode === "login" ? "没有账号？去注册" : "已有账号？去登录";
  $("auth-err").textContent = "";
};
$("auth-btn").onclick = async () => {
  try {
    const body = JSON.stringify({ username: $("username").value.trim(), password: $("password").value });
    if (mode === "register") await api("/api/register", { method: "POST", body });
    await api("/api/login", { method: "POST", body });
    const me = await api("/api/me"); showDash(me.username);
  } catch (e) { $("auth-err").textContent = e.message; }
};
$("logout-btn").onclick = async () => { await api("/api/logout", { method: "POST" }); $("userbox").textContent = ""; showAuth(); };
let addedCodes = new Set();
$("search-btn").onclick = async () => {
  try {
    const { results } = await api("/api/search?q=" + encodeURIComponent($("q").value.trim()));
    $("results").innerHTML = results.map(r => addedCodes.has(r.code)
      ? `<button disabled>${r.code} ${r.name} 已添加</button>`
      : `<button onclick="addFund('${r.code}', this)">${r.code} ${r.name} ＋</button>`).join("") || '<span class="muted">无结果</span>';
  } catch (e) { $("dash-err").textContent = e.message; }
};
async function addFund(code, btn) {
  try {
    if (btn) { btn.disabled = true; btn.textContent = "添加中…"; }
    await api("/api/watchlist", { method: "POST", body: JSON.stringify({ fund_code: code }) });
    await loadEstimates();
    if (!addedCodes.has(code)) { await new Promise(r => setTimeout(r, 1500)); await loadEstimates(); }
    if (btn) btn.textContent = btn.textContent.replace("添加中…", "已添加");
  } catch (e) { $("dash-err").textContent = e.message; if (btn) { btn.disabled = false; } }
}
async function delFund(id) {
  try { await api("/api/watchlist/" + id, { method: "DELETE" }); await loadEstimates(); }
  catch (e) { $("dash-err").textContent = e.message; }
}
function fmtPct(v) { if (v == null) return "-"; const s = (v > 0 ? "+" : "") + v.toFixed(2) + "%"; return `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${s}</span>`; }
let refreshing = false, prevSnapshot = null, currentFunds = [], currentGroups = [];
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function catOptions(current, allCats) {
  const opts = ['<option value=""' + (current ? "" : " selected") + ">未分类</option>"];
  allCats.forEach(c => opts.push(`<option value="${esc(c)}"${c === current ? " selected" : ""}>${esc(c)}</option>`));
  opts.push('<option value="__new__">＋新分类</option>');
  return opts.join("");
}
function renderFunds(data) {
  const funds = data.funds || [];
  const cats = data.categories || [...new Set(funds.map(f => f.category || "").filter(Boolean))];
  currentFunds = funds;
  const changed = new Set();
  if (prevSnapshot) {
    funds.forEach(f => {
      const p = prevSnapshot[f.fund_code];
      if (p && (p.est_nav !== f.est_nav || p.est_change_pct !== f.est_change_pct || p.dwjz !== f.dwjz)) changed.add(f.fund_code);
    });
  }
  // Groups follow category order; uncategorized always last
  currentGroups = [];
  cats.forEach(cat => {
    const items = funds.filter(f => (f.category || "") === cat);
    if (items.length) currentGroups.push({ category: cat, items });
  });
  const uncat = funds.filter(f => !(f.category || ""));
  if (uncat.length) currentGroups.push({ category: "", items: uncat });
  let html = "";
  currentGroups.forEach((g, gi) => {
    const cat = g.category;
    let header = esc(cat || "未分类");
    if (cat) {
      const ci = cats.indexOf(cat);
      header += ` <button class="mini" onclick="moveCategory(${ci}, -1)" ${ci === 0 ? "disabled" : ""}>↑</button><button class="mini" onclick="moveCategory(${ci}, 1)" ${ci === cats.length - 1 ? "disabled" : ""}>↓</button>`;
    }
    html += `<tr class="group-row"><td colspan="9">${header}</td></tr>`;
    g.items.forEach((f, ii) => {
      const ch = changed.has(f.fund_code);
      html += `<tr${ch ? ' class="changed"' : ""}>
      <td>${esc(f.fund_name)}${ch ? '<span class="badge">更新</span>' : ""}<div class="muted">${f.fund_code}${f.stale ? " · 数据可能过期" : ""}</div></td>
      <td>${f.dwjz ?? "-"}<div class="muted">${f.nav_date ?? ""}</div></td>
      <td>${f.est_nav ?? "-"}</td><td>${fmtPct(f.est_change_pct)}</td>
      <td><select class="cat" onchange="setCategory(${f.id}, this)">${catOptions(f.category || "", cats)}</select></td>
      <td class="hide-m">${f.coverage_pct}%</td>
      <td class="hide-m">${f.report_label ?? "-"}<div class="muted">${f.report_date ?? ""}</div></td>
      <td class="hide-m">${f.quote_time ?? "-"}</td>
      <td><button class="mini" onclick="moveFund(currentGroups[${gi}].category, ${ii}, -1)" ${ii === 0 ? "disabled" : ""}>↑</button><button class="mini" onclick="moveFund(currentGroups[${gi}].category, ${ii}, 1)" ${ii === g.items.length - 1 ? "disabled" : ""}>↓</button><button class="danger" onclick="delFund(${f.id})">删除</button></td></tr>`;
    });
  });
  $("tbody").innerHTML = html;
  prevSnapshot = {};
  funds.forEach(f => { prevSnapshot[f.fund_code] = { est_nav: f.est_nav, est_change_pct: f.est_change_pct, dwjz: f.dwjz }; });
}
async function moveFund(category, indexInGroup, dir) {
  const g = currentGroups.find(x => x.category === category);
  if (!g) return;
  const j = indexInGroup + dir;
  if (j < 0 || j >= g.items.length) return;
  const ids = g.items.map(f => f.id);
  [ids[indexInGroup], ids[j]] = [ids[j], ids[indexInGroup]];
  try { await api("/api/watchlist/reorder", { method: "POST", body: JSON.stringify({ category, ids }) }); await loadEstimates(); }
  catch (e) { $("dash-err").textContent = e.message; }
}
async function moveCategory(idx, dir) {
  const names = [...((window.estimateData || {}).categories || [])];
  const j = idx + dir;
  if (j < 0 || j >= names.length) return;
  [names[idx], names[j]] = [names[j], names[idx]];
  try { await api("/api/categories/reorder", { method: "POST", body: JSON.stringify({ names }) }); await loadEstimates(); }
  catch (e) { $("dash-err").textContent = e.message; }
}
async function setCategory(id, sel) {
  let cat = sel.value;
  if (cat === "__new__") {
    cat = (prompt("输入新分类名（最多 20 字）") || "").trim();
    if (!cat) { await loadEstimates(); return; }
  }
  try { await api("/api/watchlist/" + id + "/category", { method: "POST", body: JSON.stringify({ category: cat }) }); await loadEstimates(); }
  catch (e) { $("dash-err").textContent = e.message; }
}
async function loadEstimates() {
  if (refreshing) return;
  refreshing = true;
  resetCountdown();
  const rb = $("refresh-btn");
  rb.disabled = true; rb.textContent = "刷新中…";
  try {
    const data = await api("/api/estimates");
    window.estimateData = data;
    const funds = data.funds || [];
    addedCodes = new Set(funds.map(f => f.fund_code));
    $("empty-tip").style.display = funds.length ? "none" : "";
    renderFunds(data);
    $("dash-err").textContent = "";
  } catch (e) { if (String(e.message).includes("登录")) showAuth(); else $("dash-err").textContent = e.message; }
  finally { refreshing = false; rb.disabled = false; rb.textContent = "刷新估值"; }
}
$("refresh-btn").onclick = loadEstimates;
(async () => { try { const me = await api("/api/me"); showDash(me.username); } catch { showAuth(); } })();
</script>
</body>
</html>
