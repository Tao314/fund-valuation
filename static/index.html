<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基金自算估值</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F7F8FA; color: #1F2329; font-variant-numeric: tabular-nums; }
  header { background: #fff; color: #1F2329; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #EBEDF0; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 14px; }
  .card { background: #FFFFFF; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #EBEDF0; }
  .card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  .card h4 { margin: 14px 0 8px; font-size: 14px; font-weight: 600; color: #646A73; }
  input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #EBEDF0; border-radius: 8px; font-size: 15px; min-height: 42px; }
  button { padding: 9px 16px; border: 0; border-radius: 8px; background: #1677FF; color: #fff; font-size: 14px; cursor: pointer; min-height: 42px; }
  button:active { background: #0958D9; }
  button.secondary { background: #F2F3F5; color: #1F2329; }
  button.danger { background: #CF1322; padding: 5px 10px; font-size: 13px; min-height: 36px; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 6px; border-bottom: 1px solid #EBEDF0; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  .up { color: #CF1322; font-weight: 600; } .down { color: #389E0D; font-weight: 600; } .flat { color: #646A73; font-weight: 600; }
  .muted { color: #8F959E; font-size: 12px; }
  .sub { color: #646A73; font-size: 12px; }
  .err { color: #CF1322; font-size: 13px; min-height: 18px; }
  .search-results button { margin: 4px 4px 0 0; background: #F2F3F5; color: #1F2329; border: 1px solid #EBEDF0; }
  .search-results button.remove-btn { background: #FFF1F0; color: #CF1322; border-color: #FFCCC7; }
  .badge { display: inline-block; background: #FFE58F; color: #AD6800; font-size: 11px; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; transition: opacity 1s; }
  tr.group-row td { background: #F2F3F5; color: #1F2329; font-weight: 600; text-align: left; font-size: 14px; }
  button.mini { padding: 4px 8px; font-size: 13px; background: #F2F3F5; color: #1F2329; margin-right: 4px; min-height: 36px; }
  button.mini:disabled { opacity: .35; cursor: default; }
  select.cat { padding: 5px; border: 1px solid #EBEDF0; border-radius: 8px; font-size: 13px; max-width: 130px; min-height: 40px; }
  .legend { color: #646A73; font-size: 12px; margin-bottom: 8px; }
  #countdown, #market-status { color: #646A73; font-size: 13px; }
  .cat-item { display: flex; gap: 6px; align-items: center; padding: 7px 0; border-bottom: 1px solid #EBEDF0; flex-wrap: wrap; }
  .cat-item .cat-name { flex: 1; font-weight: 600; font-size: 14px; min-width: 80px; }
  footer { text-align: center; color: #8F959E; font-size: 12px; padding: 16px; }
  /* main view: compact two-line fund cards */
  .group-title { font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
  .group-title:first-child { margin-top: 0; }
  .fund-card { display: flex; justify-content: space-between; gap: 8px; background: #FFFFFF; border: 1px solid #EBEDF0; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; transition: background 1s; }
  .fund-card.changed { background: #FFFBE6; border-color: #FFE58F; }
  .fund-card .fc-left { min-width: 0; }
  .fund-card .fc-name { font-size: 14px; font-weight: 500; }
  .fund-card .fc-meta { font-size: 11px; color: #8F959E; margin-top: 4px; line-height: 1.5; }
  .fund-card .fc-right { text-align: right; flex: none; }
  .fund-card .fc-chg { font-size: 15px; font-weight: 600; }
  .fund-card .fc-est { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .fund-card .fc-nav { font-size: 12px; color: #646A73; margin-top: 2px; }
  .sort-toggle button { min-height: 40px; }
  .sort-toggle button.active { background: #1677FF; color: #fff; }
  @media (max-width: 720px) { th.hide-m, td.hide-m { display: none; } table { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <h1>基金自算估值</h1>
  <span id="userbox" class="muted"></span>
</header>
<main>
  <div id="auth" class="card" style="display:none">
    <h3 id="auth-title">登录</h3>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <div class="err" id="auth-err"></div>
    <div class="row">
      <button id="auth-btn">登录</button>
      <button class="secondary" id="auth-switch">没有账号？去注册</button>
    </div>
  </div>

  <div id="dash" style="display:none">
    <div class="card">
      <div class="row">
        <button id="nav-main">估值</button>
        <button class="secondary" id="nav-settings">设置</button>
        <span style="flex:1"></span>
        <button class="secondary" id="logout-btn">退出</button>
      </div>
    </div>

    <div id="view-main">
      <div class="card">
        <div class="row">
          <button class="secondary" id="refresh-btn">刷新估值</button>
          <span id="countdown">下次自动刷新：60s</span>
          <span id="market-status"></span>
        </div>
        <div class="row sort-toggle" style="margin-top:10px">
          <button class="secondary active" id="sort-default">默认顺序</button>
          <button class="secondary" id="sort-change">按涨跌幅</button>
          <button class="secondary" id="sort-coverage">按覆盖率</button>
        </div>
        <div class="err" id="dash-err"></div>
      </div>
      <div class="card">
        <div class="legend">黄色高亮＋「更新」标记 = 相对上一次刷新有变化，几秒后自动消失。</div>
        <div id="fund-cards"></div>
        <div class="muted" id="empty-tip">列表为空，去「设置」里搜索添加基金。</div>
      </div>
    </div>

    <div id="view-settings" style="display:none">
      <div class="err" id="settings-err"></div>
      <div class="card">
        <h3>自动刷新</h3>
        <div class="row">
          <input id="refresh-seconds" type="number" min="10" max="600" step="1" style="max-width:140px; flex:none">
          <span class="muted">秒（10–600）</span>
          <button id="save-refresh-btn">保存</button>
          <span class="muted" id="refresh-saved"></span>
        </div>
      </div>
      <div class="card">
        <h3>自选与分类管理</h3>
        <h4>分类</h4>
        <div id="cat-list"></div>
        <div class="row" style="margin-top:10px">
          <input id="new-cat-name" placeholder="新分类名（最多 20 字）">
          <button id="add-cat-btn">添加分类</button>
        </div>
        <div class="muted">删除分类后，该分类下的基金变为未分类（基金不会被删除）。</div>
        <h4>自选基金</h4>
        <div class="row">
          <input id="search-q" placeholder="搜索基金代码或名称，如 005827">
          <button id="search-btn">搜索</button>
        </div>
        <div class="search-results" id="results"></div>
        <div style="overflow-x:auto; margin-top:10px">
          <table>
            <thead><tr><th>基金</th><th>分类</th><th>顺序/操作</th></tr></thead>
            <tbody id="settings-tbody"></tbody>
          </table>
          <div class="muted" id="settings-empty-tip">暂无自选基金，先搜索添加。</div>
        </div>
      </div>
      <div class="card">
        <h3>账户</h3>
        <input id="old-password" type="password" placeholder="旧密码" autocomplete="current-password">
        <input id="new-password" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password">
        <input id="confirm-password" type="password" placeholder="确认新密码" autocomplete="new-password">
        <div class="row">
          <button id="change-password-btn">修改密码</button>
          <span class="muted" id="password-saved"></span>
        </div>
        <div class="muted">修改后其他设备上的登录会失效，当前设备保持登录。</div>
      </div>
    </div>
  </div>
</main>
<footer>自算估值，仅供参考，以基金公司公布净值为准。估值基于最新披露前十大重仓股实时涨跌加权计算，与实际净值可能有偏差。<br><span id="app-version">版本 v1.6.0 · 更新于 2026-11-20 00:14</span></footer>
<script>
const $ = id => document.getElementById(id);
let mode = "login", timer = null, refreshSeconds = 60;
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("请求失败 " + r.status));
  return data;
}
function setErr(msg) { const a = $("dash-err"), b = $("settings-err"); if (a) a.textContent = msg; if (b) b.textContent = msg; }
let countdownTimer = null, countdownLeft = 60;
function resetCountdown() {
  countdownLeft = refreshSeconds;
  const el = $("countdown"); if (el) el.textContent = "下次自动刷新：" + countdownLeft + "s";
  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdownLeft = Math.max(0, countdownLeft - 1);
    const e2 = $("countdown"); if (e2) e2.textContent = "下次自动刷新：" + countdownLeft + "s";
  }, 1000);
}
function startAutoRefresh() { clearInterval(timer); timer = setInterval(loadEstimates, refreshSeconds * 1000); }
// Market status from browser local time (assumes Asia/Shanghai). Holidays not handled.
function marketStatusText() {
  const now = new Date();
  const day = now.getDay(); // 0 Sun .. 6 Sat
  const mins = now.getHours() * 60 + now.getMinutes();
  const weekday = day >= 1 && day <= 5;
  function cnStatus(open1, close1, open2, close2) {
    if (!weekday) return "休市";
    if (mins < open1) return "未开盘";
    if (mins < close1) return "盘中";
    if (mins < open2) return "午休";
    if (mins < close2) return "盘中";
    return "已收盘";
  }
  const a = cnStatus(570, 690, 780, 900);   // A股 09:30-11:30, 13:00-15:00
  const hk = cnStatus(570, 720, 780, 960);  // 港股 09:30-12:00, 13:00-16:00
  // 美股 approx 21:30-04:00 next day (DST ignored)
  let us;
  if ((weekday && mins >= 1290) || (day >= 2 && day <= 6 && mins < 240)) us = "盘中";
  else if (!weekday && !(day === 6 && mins < 240)) us = "休市";
  else us = "未开盘";
  return "A股" + a + " · 港股" + hk + " · 美股" + us;
}
function updateMarketStatus() { const el = $("market-status"); if (el) el.textContent = marketStatusText(); }
setInterval(updateMarketStatus, 60000);
function showView(name) {
  $("view-main").style.display = name === "main" ? "" : "none";
  $("view-settings").style.display = name === "settings" ? "" : "none";
  $("nav-main").className = name === "main" ? "" : "secondary";
  $("nav-settings").className = name === "settings" ? "" : "secondary";
}
$("nav-main").onclick = () => showView("main");
$("nav-settings").onclick = () => showView("settings");
function showAuth() { $("auth").style.display = ""; $("dash").style.display = "none"; clearInterval(timer); clearInterval(countdownTimer); prevSnapshot = null; }
function showDash(user) {
  $("auth").style.display = "none"; $("dash").style.display = "";
  $("userbox").textContent = user;
  prevSnapshot = null;
  showView("main");
  updateMarketStatus();
  loadEstimates();
  startAutoRefresh();
}
$("auth-switch").onclick = () => {
  mode = mode === "login" ? "register" : "login";
  $("auth-title").textContent = mode === "login" ? "登录" : "注册";
  $("auth-btn").textContent = mode === "login" ? "登录" : "注册";
  $("auth-switch").textContent = mode === "login" ? "没有账号？去注册" : "已有账号？去登录";
  $("auth-err").textContent = "";
};
$("auth-btn").onclick = async () => {
  try {
    const body = JSON.stringify({ username: $("username").value.trim(), password: $("password").value });
    if (mode === "register") await api("/api/register", { method: "POST", body });
    await api("/api/login", { method: "POST", body });
    const me = await api("/api/me"); showDash(me.username);
  } catch (e) { $("auth-err").textContent = e.message; }
};
$("logout-btn").onclick = async () => { await api("/api/logout", { method: "POST" }); $("userbox").textContent = ""; showAuth(); };
let addedCodes = new Set(), lastSearchQ = "";
async function runSearch() {
  const { results } = await api("/api/search?q=" + encodeURIComponent(lastSearchQ));
  $("results").innerHTML = results.map(r => addedCodes.has(r.code)
    ? `<button disabled>${r.code} ${esc(r.name)} 已添加</button><button class="remove-btn" onclick="removeFromSearch('${r.code}')">移除</button>`
    : `<button onclick="addFund('${r.code}', this)">${r.code} ${esc(r.name)} ＋</button>`).join("") || '<span class="muted">无结果</span>';
}
$("search-btn").onclick = async () => {
  try { lastSearchQ = $("search-q").value.trim(); await runSearch(); }
  catch (e) { setErr(e.message); }
};
async function addFund(code, btn) {
  try {
    if (btn) { btn.disabled = true; btn.textContent = "添加中…"; }
    await api("/api/watchlist", { method: "POST", body: JSON.stringify({ fund_code: code }) });
    await loadEstimates();
    if (!addedCodes.has(code)) { await new Promise(r => setTimeout(r, 1500)); await loadEstimates(); }
    if (lastSearchQ) await runSearch();
  } catch (e) { setErr(e.message); if (btn) { btn.disabled = false; } }
}
async function removeFromSearch(code) {
  const f = currentFunds.find(x => x.fund_code === code);
  if (!f) return;
  if (!confirm("从自选移除基金「" + f.fund_name + "」？")) return;
  try {
    await api("/api/watchlist/" + f.id, { method: "DELETE" });
    await loadEstimates();
    if (lastSearchQ) await runSearch();
  } catch (e) { setErr(e.message); }
}
async function delFund(id, name) {
  if (!confirm("删除基金「" + name + "」？")) return;
  try { await api("/api/watchlist/" + id, { method: "DELETE" }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
function fmtPct(v) { if (v == null) return "-"; const s = (v > 0 ? "+" : "") + v.toFixed(2) + "%"; return `<span class="${v > 0 ? "up" : v < 0 ? "down" : "flat"}">${s}</span>`; }
let refreshing = false, prevSnapshot = null, currentFunds = [], currentGroups = [], sortMode = "default", fadeTimer = null;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function catOptions(current, allCats) {
  const opts = ['<option value=""' + (current ? "" : " selected") + ">未分类</option>"];
  allCats.forEach(c => opts.push(`<option value="${esc(c)}"${c === current ? " selected" : ""}>${esc(c)}</option>`));
  opts.push('<option value="__new__">＋新分类</option>');
  return opts.join("");
}
function buildGroups(data) {
  const funds = data.funds || [];
  const cats = data.categories || [...new Set(funds.map(f => f.category || "").filter(Boolean))];
  currentFunds = funds;
  // Groups follow category order; uncategorized always last
  currentGroups = [];
  cats.forEach(cat => {
    const items = funds.filter(f => (f.category || "") === cat);
    if (items.length) currentGroups.push({ category: cat, items });
  });
  const uncat = funds.filter(f => !(f.category || ""));
  if (uncat.length) currentGroups.push({ category: "", items: uncat });
  return cats;
}
function sortedItems(items) {
  if (sortMode === "default") return items;
  const key = sortMode === "change" ? "est_change_pct" : "coverage_pct";
  return [...items].sort((a, b) => (b[key] ?? -Infinity) - (a[key] ?? -Infinity));
}
function renderFunds(data) {
  const funds = data.funds || [];
  buildGroups(data);
  const changed = new Set();
  if (prevSnapshot) {
    funds.forEach(f => {
      const p = prevSnapshot[f.fund_code];
      if (p && (p.est_nav !== f.est_nav || p.est_change_pct !== f.est_change_pct || p.dwjz !== f.dwjz)) changed.add(f.fund_code);
    });
  }
  let html = "";
  currentGroups.forEach(g => {
    html += `<div class="group-title">${esc(g.category || "未分类")}</div>`;
    sortedItems(g.items).forEach(f => {
      const ch = changed.has(f.fund_code);
      html += `<div class="fund-card${ch ? " changed" : ""}">
      <div class="fc-left">
        <div class="fc-name">${esc(f.fund_name)}${ch ? '<span class="badge">更新</span>' : ""}</div>
        <div class="fc-meta">${f.fund_code}${f.stale ? " · 数据可能过期" : ""}<br>覆盖 ${f.coverage_pct}% · ${esc(f.report_label ?? "-")} ${f.report_date ?? ""}<br>行情 ${f.quote_time ?? "-"}</div>
      </div>
      <div class="fc-right">
        <div class="fc-chg">${fmtPct(f.est_change_pct)}</div>
        <div class="fc-est">${f.est_nav ?? "-"}</div>
        <div class="fc-nav">昨日净值 ${f.dwjz ?? "-"}（${f.nav_date ?? ""}）</div>
      </div></div>`;
    });
  });
  $("fund-cards").innerHTML = html;
  prevSnapshot = {};
  funds.forEach(f => { prevSnapshot[f.fund_code] = { est_nav: f.est_nav, est_change_pct: f.est_change_pct, dwjz: f.dwjz }; });
  // fade out change markers after 4s
  clearTimeout(fadeTimer);
  if (changed.size) {
    fadeTimer = setTimeout(() => {
      document.querySelectorAll(".fund-card.changed").forEach(el => {
        el.classList.remove("changed");
        const b = el.querySelector(".badge"); if (b) b.remove();
      });
    }, 4000);
  }
}
function renderSettings(data) {
  const cats = buildGroups(data);
  const funds = data.funds || [];
  // refresh-seconds input: don't clobber while user is editing it
  const inp = $("refresh-seconds");
  if (document.activeElement !== inp) inp.value = refreshSeconds;
  // category list
  $("cat-list").innerHTML = cats.length ? cats.map((c, i) =>
    `<div class="cat-item"><span class="cat-name">${esc(c)}</span>
     <button class="mini" onclick="moveCategoryTo(${i}, 'top')" ${i === 0 ? "disabled" : ""}>置顶</button>
     <button class="mini" onclick="moveCategory(${i}, -1)" ${i === 0 ? "disabled" : ""}>↑</button>
     <button class="mini" onclick="moveCategory(${i}, 1)" ${i === cats.length - 1 ? "disabled" : ""}>↓</button>
     <button class="mini" onclick="moveCategoryTo(${i}, 'bottom')" ${i === cats.length - 1 ? "disabled" : ""}>置底</button>
     <button class="mini" onclick="renameCategory('${esc(c)}')">重命名</button>
     <button class="danger" onclick="deleteCategory('${esc(c)}')">删除</button></div>`).join("")
    : '<div class="muted">暂无分类，在下方添加。</div>';
  // watchlist grouped, with management controls
  let html = "";
  currentGroups.forEach((g, gi) => {
    html += `<tr class="group-row"><td colspan="3">${esc(g.category || "未分类")}</td></tr>`;
    g.items.forEach((f, ii) => {
      html += `<tr>
      <td>${esc(f.fund_name)}<div class="muted">${f.fund_code}</div></td>
      <td><select class="cat" onchange="setCategory(${f.id}, this)">${catOptions(f.category || "", cats)}</select></td>
      <td><button class="mini" onclick="moveFundTo(currentGroups[${gi}].category, ${ii}, 'top')" ${ii === 0 ? "disabled" : ""}>置顶</button><button class="mini" onclick="moveFund(currentGroups[${gi}].category, ${ii}, -1)" ${ii === 0 ? "disabled" : ""}>↑</button><button class="mini" onclick="moveFund(currentGroups[${gi}].category, ${ii}, 1)" ${ii === g.items.length - 1 ? "disabled" : ""}>↓</button><button class="mini" onclick="moveFundTo(currentGroups[${gi}].category, ${ii}, 'bottom')" ${ii === g.items.length - 1 ? "disabled" : ""}>置底</button><button class="danger" onclick="delFund(${f.id}, '${esc(f.fund_name)}')">删除</button></td></tr>`;
    });
  });
  $("settings-tbody").innerHTML = html;
  $("settings-empty-tip").style.display = funds.length ? "none" : "";
}
async function moveFund(category, indexInGroup, dir) {
  const g = currentGroups.find(x => x.category === category);
  if (!g) return;
  const j = indexInGroup + dir;
  if (j < 0 || j >= g.items.length) return;
  const ids = g.items.map(f => f.id);
  [ids[indexInGroup], ids[j]] = [ids[j], ids[indexInGroup]];
  try { await api("/api/watchlist/reorder", { method: "POST", body: JSON.stringify({ category, ids }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function moveFundTo(category, indexInGroup, pos) {
  const g = currentGroups.find(x => x.category === category);
  if (!g) return;
  const ids = g.items.map(f => f.id);
  const [id] = ids.splice(indexInGroup, 1);
  if (pos === "top") ids.unshift(id); else ids.push(id);
  try { await api("/api/watchlist/reorder", { method: "POST", body: JSON.stringify({ category, ids }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function moveCategory(idx, dir) {
  const names = [...((window.estimateData || {}).categories || [])];
  const j = idx + dir;
  if (j < 0 || j >= names.length) return;
  [names[idx], names[j]] = [names[j], names[idx]];
  try { await api("/api/categories/reorder", { method: "POST", body: JSON.stringify({ names }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function moveCategoryTo(idx, pos) {
  const names = [...((window.estimateData || {}).categories || [])];
  if (idx < 0 || idx >= names.length) return;
  const [name] = names.splice(idx, 1);
  if (pos === "top") names.unshift(name); else names.push(name);
  try { await api("/api/categories/reorder", { method: "POST", body: JSON.stringify({ names }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function setCategory(id, sel) {
  let cat = sel.value;
  if (cat === "__new__") {
    cat = (prompt("输入新分类名（最多 20 字）") || "").trim();
    if (!cat) { await loadEstimates(); return; }
  }
  try { await api("/api/watchlist/" + id + "/category", { method: "POST", body: JSON.stringify({ category: cat }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
$("add-cat-btn").onclick = async () => {
  const name = $("new-cat-name").value.trim();
  if (!name) { setErr("分类名不能为空"); return; }
  try {
    await api("/api/categories", { method: "POST", body: JSON.stringify({ name }) });
    $("new-cat-name").value = "";
    await loadEstimates();
  } catch (e) { setErr(e.message); }
};
async function renameCategory(oldName) {
  const newName = (prompt("输入新分类名（最多 20 字）", oldName) || "").trim();
  if (!newName || newName === oldName) return;
  try { await api("/api/categories/rename", { method: "POST", body: JSON.stringify({ old: oldName, new: newName }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function deleteCategory(name) {
  if (!confirm("删除分类「" + name + "」？该分类下的基金将变为未分类，基金不会被删除。")) return;
  try { await api("/api/categories/delete", { method: "POST", body: JSON.stringify({ name }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
$("save-refresh-btn").onclick = async () => {
  const n = parseInt($("refresh-seconds").value, 10);
  if (!Number.isInteger(n) || n < 10 || n > 600) { setErr("自动刷新时间需 10-600 秒"); return; }
  try {
    await api("/api/settings", { method: "POST", body: JSON.stringify({ refresh_seconds: n }) });
    refreshSeconds = n;
    startAutoRefresh(); resetCountdown();
    $("refresh-saved").textContent = "已保存";
    setErr("");
  } catch (e) { setErr(e.message); }
};
$("change-password-btn").onclick = async () => {
  const oldPw = $("old-password").value, newPw = $("new-password").value, confirmPw = $("confirm-password").value;
  if (!oldPw || !newPw) { setErr("旧密码和新密码不能为空"); return; }
  if (newPw !== confirmPw) { setErr("两次输入的新密码不一致"); return; }
  try {
    await api("/api/change-password", { method: "POST", body: JSON.stringify({ old_password: oldPw, new_password: newPw }) });
    $("old-password").value = ""; $("new-password").value = ""; $("confirm-password").value = "";
    $("password-saved").textContent = "密码已修改";
    setErr("");
  } catch (e) { setErr(e.message); }
};
function setSortMode(mode) {
  sortMode = mode;
  $("sort-default").className = "secondary" + (mode === "default" ? " active" : "");
  $("sort-change").className = "secondary" + (mode === "change" ? " active" : "");
  $("sort-coverage").className = "secondary" + (mode === "coverage" ? " active" : "");
  if (window.estimateData) renderFunds(window.estimateData);
}
$("sort-default").onclick = () => setSortMode("default");
$("sort-change").onclick = () => setSortMode("change");
$("sort-coverage").onclick = () => setSortMode("coverage");
async function loadEstimates() {
  if (refreshing) return;
  refreshing = true;
  resetCountdown();
  const rb = $("refresh-btn");
  rb.disabled = true; rb.textContent = "刷新中…";
  try {
    const data = await api("/api/estimates");
    window.estimateData = data;
    if (data.refresh_seconds && data.refresh_seconds !== refreshSeconds) {
      refreshSeconds = data.refresh_seconds;
      startAutoRefresh(); resetCountdown();
    }
    const funds = data.funds || [];
    addedCodes = new Set(funds.map(f => f.fund_code));
    $("empty-tip").style.display = funds.length ? "none" : "";
    renderFunds(data);
    renderSettings(data);
    setErr("");
  } catch (e) { if (String(e.message).includes("登录")) showAuth(); else setErr(e.message); }
  finally { refreshing = false; rb.disabled = false; rb.textContent = "刷新估值"; }
}
$("refresh-btn").onclick = loadEstimates;
(async () => { try { const me = await api("/api/me"); showDash(me.username); } catch { showAuth(); } })();
</script>
</body>
</html>
