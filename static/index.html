<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基金自算估值</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F6F8; color: #202939; font-variant-numeric: tabular-nums; }
  /* safety guard against any stray horizontal overflow; clip (where supported)
     does not create a scroll container, so sticky header/toolbar keep working */
  html, body { overflow-x: hidden; overflow-x: clip; }
  :root { --header-h: 47px; }
  header { background: #fff; color: #202939; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid #EAECF0; position: sticky; top: 0; z-index: 30; }
  #userbox { flex: none; max-width: 35vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; line-height: 22px; }
  .title-wrap { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
  .title-note { font-size: 11px; color: #98A2B3; line-height: 22px; }
  .toolbar-card { position: sticky; top: var(--header-h); z-index: 20; max-width: 100%; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px; }
  .card { background: #FFFFFF; border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #EAECF0; box-shadow: 0 1px 2px rgba(16,24,40,.04); max-width: 100%; }
  img, input, select, button { max-width: 100%; }
  .card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: #202939; }
  .card h4 { margin: 14px 0 8px; font-size: 14px; font-weight: 600; color: #667085; }
  input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #EAECF0; border-radius: 8px; font-size: 15px; min-height: 42px; }
  button { padding: 9px 16px; border: 0; border-radius: 8px; background: #2563EB; color: #fff; font-size: 14px; cursor: pointer; min-height: 42px; }
  button:active { background: #1D4ED8; }
  button.secondary { background: #F2F3F5; color: #202939; }
  button.danger { background: #FFFFFF; color: #C9362B; border: 1px solid #C9362B; padding: 5px 10px; font-size: 13px; min-height: 40px; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 6px; border-bottom: 1px solid #EAECF0; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  .up { color: #C9362B; font-weight: 600; } .down { color: #07845B; font-weight: 600; } .flat { color: #667085; font-weight: 600; }
  .muted { color: #98A2B3; font-size: 12px; }
  .sub { color: #667085; font-size: 12px; }
  .err { color: #C9362B; font-size: 13px; min-height: 18px; }
  .search-results button { margin: 4px 4px 0 0; background: #F2F3F5; color: #202939; border: 1px solid #EAECF0; max-width: 100%; }
  .search-results button:disabled { background: #E8F3FF; color: #2563EB; border-color: #E8F3FF; }
  .search-results button.remove-btn { background: #FFFFFF; color: #C9362B; border-color: #C9362B; }
  .badge { display: inline-block; background: #FEF3C7; color: #B45309; font-size: 10px; border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: middle; transition: opacity 1s; }
  tr.group-row td { background: #F5F6F8; color: #202939; font-weight: 600; text-align: left; font-size: 14px; }
  button.mini { padding: 4px 8px; font-size: 13px; background: #F2F3F5; color: #202939; margin-right: 4px; min-height: 40px; }
  button.mini:disabled { opacity: .35; cursor: default; }
  select.cat { padding: 5px; border: 1px solid #EAECF0; border-radius: 8px; font-size: 13px; max-width: 130px; min-height: 40px; }
  #countdown { color: #667085; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ms-pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; background: #ECEFF4; border-radius: 999px; font-size: 11px; font-weight: 500; color: #374151; flex: 1; min-width: 0; }
  #ms-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-dot { width: 6px; height: 6px; border-radius: 50%; background: #98A2B3; flex: none; }
  .ms-dot.on { background: #07845B; }
  .cat-item { display: flex; gap: 6px; align-items: center; padding: 7px 0; border-bottom: 1px solid #EAECF0; flex-wrap: wrap; }
  .cat-item .cat-name { flex: 1; font-weight: 600; font-size: 14px; min-width: 80px; }
  footer { text-align: center; color: #98A2B3; font-size: 11px; padding: 16px; }
  /* main view: compact two-line fund cards */
  .group-title { display: flex; align-items: center; gap: 8px; min-height: 28px; margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #EAECF0; }
  .group-title:first-child { margin-top: 2px; padding-top: 0; border-top: 0; }
  .group-title .gt-bar { width: 3px; height: 14px; border-radius: 2px; background: #2563EB; flex: none; }
  .group-title .gt-bar-gray { background: #98A2B3; }
  .group-title .gt-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #202939; line-height: 22px; letter-spacing: .5px; word-break: normal; overflow-wrap: break-word; }
  .group-title .gt-stats { font-size: 12px; font-weight: 500; color: #667085; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
  .group-title .gt-stats .up, .group-title .gt-stats .down, .group-title .gt-stats .flat { font-weight: 500; font-size: 12px; }
  .fund-card { background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.04); padding: 12px; margin-bottom: 10px; transition: box-shadow 1s; overflow: hidden; }
  .fund-card.changed { box-shadow: inset 3px 0 0 #F59E0B, 0 1px 2px rgba(16,24,40,.04); }
  .fund-card .fc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .fund-card .fc-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.35; word-break: normal; overflow-wrap: break-word; }
  .fund-card .fc-chg { font-size: 20px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .fund-card .fc-chg .up, .fund-card .fc-chg .down, .fund-card .fc-chg .flat { font-weight: 700; }
  .fund-card .fc-meta { font-size: 11px; color: #98A2B3; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fund-card .fc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 6px; font-size: 13px; line-height: 1.4; color: #667085; flex-wrap: wrap; }
  .fund-card .fc-row .fc-label { white-space: nowrap; font-size: 12px; font-weight: 400; color: #667085; }
  .fund-card .fc-row .fc-val { white-space: nowrap; font-variant-numeric: tabular-nums; margin-left: auto; }
  .fund-card .fc-row .fc-val b { font-size: 15px; font-weight: 600; color: #202939; }
  .fund-card .fc-row .up, .fund-card .fc-row .down, .fund-card .fc-row .flat { font-size: 13px; font-weight: 500; }
  .fund-card .fc-row-prev .fc-val { font-size: 13px; font-weight: 400; color: #344054; }
  .fund-card .fc-row-diff { border-top: 1px solid #F0F2F5; padding-top: 6px; font-size: 12px; }
  .fund-card .fc-row-today { background: #EEF2FF; border-radius: 8px; padding: 6px 8px; margin-left: -8px; margin-right: -8px; }
  .fund-card .fc-row-today .fc-label { font-weight: 600; color: #344054; }
  .fund-card .fc-row-today .fc-val b { font-size: 16px; font-weight: 700; }
  .fund-card .fc-row-diff .fc-diff { font-size: 12px; font-weight: 500; color: #344054; }
  .fund-card .fc-status { font-size: 11px; color: #98A2B3; font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .fund-card .fc-state { font-size: 11px; color: #98A2B3; font-weight: 400; margin-left: 4px; white-space: nowrap; }
  .fund-card .fc-pub { font-size: 11px; color: #98A2B3; font-weight: 400; margin-left: 4px; white-space: nowrap; }
  .fund-card .fc-diff { font-size: 11px; color: #98A2B3; }
  .fund-card .fc-spark { position: relative; margin-top: 8px; }
  .fund-card .fc-spark svg { display: block; width: 100%; height: 44px; }
  .fund-card .fc-spark .sp-max, .fund-card .fc-spark .sp-min { position: absolute; left: 0; font-size: 10px; line-height: 1; color: #98A2B3; font-variant-numeric: tabular-nums; pointer-events: none; }
  .fund-card .fc-spark .sp-max { top: 0; }
  .fund-card .fc-spark .sp-min { top: 34px; }
  .fund-card .fc-spark .sp-times { display: flex; justify-content: space-between; font-size: 10px; color: #98A2B3; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sort-toggle button { min-height: 26px; height: 26px; padding: 0 8px; font-size: 11px; background: #F3F4F6; color: #667085; border-radius: 6px; }
  .sort-toggle button.active { background: #2563EB; color: #fff; font-weight: 600; }
  .sort-toggle button:active { background: #E5E7EB; }
  .sort-toggle button.active:active { background: #1D4ED8; }
  /* compact top toolbar (v1.10.6): two slim rows instead of big buttons */
  .toolbar-row1 { display: flex; align-items: center; gap: 8px; min-height: 34px; flex-wrap: wrap; }
  /* row1 items keep natural size and wrap to the next line instead of
     shrinking/clipping or pushing the card wider than the viewport */
  .toolbar-row1 > * { flex: none; }
  .toolbar-row2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .toolbar-row2 .sort-toggle { display: flex; gap: 4px; flex: none; }
  .tab-btn { height: 28px; min-height: 28px; padding: 0 10px; font-size: 13px; font-weight: 500; border-radius: 8px; background: #ECEEF2; color: #667085; }
  .tab-btn.active { background: #EBF1FF; color: #2563EB; font-weight: 600; }
  .tab-btn:active { background: #EBF1FF; }
  #refresh-btn { width: 28px; height: 28px; min-height: 28px; padding: 0; border-radius: 8px; background: #EBF1FF; color: #2563EB; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  #refresh-btn:active { background: #DBEAFE; }
  #refresh-btn.spinning svg { animation: fv-spin .8s linear infinite; }
  @keyframes fv-spin { to { transform: rotate(360deg); } }
  .logout-btn { background: transparent; color: #667085; font-size: 12px; padding: 4px 6px; min-height: 24px; height: 24px; }
  .logout-btn:active { background: transparent; color: #374151; }
  /* ranking view (v1.11.0) */
  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip { min-height: 28px; height: 28px; padding: 0 10px; font-size: 12px; border-radius: 999px; background: #F2F3F5; color: #667085; white-space: nowrap; flex: none; }
  .chip.active { background: #2563EB; color: #fff; font-weight: 600; }
  .chip:active { background: #E5E7EB; }
  .chip.active:active { background: #1D4ED8; }
  .rank-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #F0F2F5; }
  .rank-row:last-child { border-bottom: 0; }
  .rk-num { width: 28px; flex: none; text-align: center; font-size: 14px; font-weight: 600; color: #98A2B3; }
  .rk-num.top { color: #2563EB; font-weight: 700; font-size: 16px; }
  .rk-main { flex: 1; min-width: 0; }
  .rk-name { font-size: 14px; font-weight: 600; line-height: 1.35; overflow-wrap: break-word; }
  .rk-sub { font-size: 11px; color: #98A2B3; margin-top: 2px; }
  .rk-val { font-size: 17px; font-weight: 700; white-space: nowrap; flex: none; }
  .rk-val .up, .rk-val .down, .rk-val .flat { font-weight: 700; }
  .rk-updated { font-size: 11px; color: #98A2B3; text-align: center; margin-top: 10px; }
  .rk-note { font-size: 12px; color: #98A2B3; line-height: 1.5; margin: 2px 2px 8px; }
  .rank-warming { text-align: center; padding: 18px 0; }
  .rank-warming .dot { animation: rank-pulse 1.2s ease-in-out infinite; }
  @keyframes rank-pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  /* admin view (v1.12.0) */
  .admin-badge { display: inline-block; background: #EBF1FF; color: #2563EB; font-size: 10px; font-weight: 600; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .admin-user-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid #F0F2F5; flex-wrap: wrap; }
  .admin-user-row:last-child { border-bottom: 0; }
  .admin-user-row .au-main { flex: 1; min-width: 140px; }
  .admin-user-row .au-name { font-size: 14px; font-weight: 600; line-height: 1.35; overflow-wrap: break-word; }
  .admin-user-row .au-sub { font-size: 11px; color: #98A2B3; margin-top: 2px; }
  .admin-user-row .au-actions { display: flex; gap: 6px; flex: none; }
  .log-row { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid #F0F2F5; font-size: 12px; flex-wrap: wrap; }
  .log-row:last-child { border-bottom: 0; }
  .log-row .lg-time { color: #98A2B3; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .log-row .lg-user { font-weight: 600; overflow-wrap: break-word; }
  .log-row .lg-ok { color: #07845B; font-weight: 600; white-space: nowrap; }
  .log-row .lg-fail { color: #C9362B; font-weight: 600; white-space: nowrap; }
  .log-row .lg-ip { color: #667085; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* settings watchlist rows (v1.12.2): flex rows so controls never overflow on mobile */
  .wl-group { background: #F5F6F8; color: #202939; font-weight: 600; font-size: 14px; padding: 8px; border-radius: 8px; margin: 12px 0 2px; }
  .wl-row { padding: 9px 0; border-bottom: 1px solid #F0F2F5; }
  .wl-line1 { display: flex; align-items: flex-start; gap: 8px; }
  .wl-main { flex: 1; min-width: 0; }
  .wl-name { font-size: 14px; font-weight: 600; line-height: 1.35; overflow-wrap: break-word; }
  .wl-code { font-size: 12px; color: #98A2B3; margin-top: 2px; }
  .wl-row select.cat { flex: none; max-width: 110px; }
  .wl-ops { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .wl-ops button.mini { margin-right: 0; }
  @media (max-width: 720px) { th.hide-m, td.hide-m { display: none; } table { font-size: 13px; } }
  /* Gemini mobile breakpoints: <=359 超窄 / 360-389 紧凑 / 390-429 标准 / >=430 大屏 (main max-width 1100px already caps desktop) */
  /* toolbar row1 (4 tabs + refresh + countdown + logout) must fit one line at
     390px and wrap cleanly below that instead of overflowing the card */
  @media (max-width: 429px) { .toolbar-row1 { gap: 6px; } .tab-btn { padding: 0 8px; } }
  @media (max-width: 359px) { .fund-card { padding: 10px 12px; } .fund-card .fc-chg { font-size: 16px; } .fund-card .fc-row { font-size: 12px; } .fund-card .fc-row .fc-val b { font-size: 14px; } .tab-btn { padding: 0 6px; } }
  @media (min-width: 360px) and (max-width: 389px) { .fund-card { padding: 10px 12px; } }
  @media (min-width: 390px) and (max-width: 429px) { .fund-card { padding: 12px; } .fund-card .fc-chg { font-size: 20px; } .fund-card .fc-row { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <div class="title-wrap"><h1>基金自算估值</h1><span class="title-note">估值与市场占比均按最新披露前十大持仓计算</span></div>
  <span id="userbox" class="muted"></span>
</header>
<main>
  <div id="auth" class="card" style="display:none">
    <h3 id="auth-title">登录</h3>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <div class="err" id="auth-err"></div>
    <div class="row">
      <button id="auth-btn">登录</button>
      <button class="secondary" id="auth-switch">没有账号？去注册</button>
    </div>
  </div>

  <div id="dash" style="display:none">
    <div class="card toolbar-card">
      <div class="toolbar-row1">
        <button class="tab-btn active" id="nav-main">估值</button>
        <button class="tab-btn" id="nav-rank">排行榜</button>
        <button class="tab-btn" id="nav-admin" style="display:none">管理</button>
        <button class="tab-btn" id="nav-settings">设置</button>
        <span style="flex:1"></span>
        <button id="refresh-btn" title="刷新" aria-label="刷新"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>
        <span id="countdown" title="下次自动刷新">60s</span>
        <button class="logout-btn" id="logout-btn">退出</button>
      </div>
      <div class="toolbar-row2" id="toolbar-row2">
        <span id="market-status" class="ms-pill"><span class="ms-dot" id="ms-dot"></span><span id="ms-text"></span></span>
        <div class="sort-toggle">
          <button class="secondary active" id="sort-default">默认顺序</button>
          <button class="secondary" id="sort-change">按涨跌幅</button>
        </div>
      </div>
    </div>

    <div id="view-main">
      <div class="card">
        <div id="fund-cards"></div>
        <div class="muted" id="empty-tip">加载中…</div>
        <div class="err" id="dash-err"></div>
      </div>
    </div>

    <div id="view-rank" style="display:none">
      <div class="card">
        <div class="chip-row" id="rank-boards">
          <button class="chip active" data-board="returns">涨幅榜</button>
          <button class="chip" data-board="us">美股占比（QDII）</button>
          <button class="chip" data-board="vol">波动率</button>
        </div>
        <div class="chip-row" id="rank-periods">
          <button class="chip" data-period="daily">昨日</button>
          <button class="chip" data-period="1w">近1周</button>
          <button class="chip" data-period="1m">近1月</button>
          <button class="chip" data-period="3m">近3月</button>
          <button class="chip" data-period="6m">近6月</button>
          <button class="chip active" data-period="1y">近1年</button>
          <button class="chip" data-period="ytd">今年来</button>
        </div>
        <div class="rk-note" id="rank-note"></div>
        <div id="rank-list"></div>
        <div class="err" id="rank-err"></div>
        <div class="rk-updated" id="rank-updated"></div>
      </div>
    </div>

    <div id="view-admin" style="display:none">
      <div class="err" id="admin-err"></div>
      <div class="card">
        <h3>用户管理</h3>
        <div id="admin-user-list"></div>
        <h4>新增用户</h4>
        <div class="row">
          <input id="admin-new-username" placeholder="用户名（3-32 个字符）" autocomplete="off">
          <input id="admin-new-password" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password">
          <button id="admin-add-user-btn">添加用户</button>
        </div>
      </div>
      <div class="card">
        <h3>登录记录</h3>
        <div id="admin-login-logs"></div>
      </div>
    </div>

    <div id="view-settings" style="display:none">
      <div class="err" id="settings-err"></div>
      <div class="card">
        <h3>自动刷新</h3>
        <div class="row">
          <input id="refresh-seconds" type="number" min="10" max="600" step="1" style="max-width:140px; flex:none">
          <span class="muted">秒（10–600）</span>
          <button id="save-refresh-btn">保存</button>
          <span class="muted" id="refresh-saved"></span>
        </div>
      </div>
      <div class="card">
        <h3>自选与分类管理</h3>
        <h4>分类</h4>
        <div id="cat-list"></div>
        <div class="row" style="margin-top:10px">
          <input id="new-cat-name" placeholder="新分类名（最多 20 字）">
          <button id="add-cat-btn">添加分类</button>
        </div>
        <div class="muted">删除分类后，该分类下的基金变为未分类（基金不会被删除）。</div>
        <h4>自选基金</h4>
        <div class="row">
          <input id="search-q" placeholder="搜索基金代码或名称，如 005827">
          <button id="search-btn">搜索</button>
        </div>
        <div class="row" style="margin-top:6px">
          <span class="sub">分类</span>
          <select id="add-cat" class="cat"><option value="">未分类</option></select>
          <span class="muted">新添加的基金直接进入所选分类</span>
        </div>
        <div class="search-results" id="results"></div>
        <div id="settings-list" style="margin-top:10px"></div>
        <div class="muted" id="settings-empty-tip">暂无自选基金，先搜索添加。</div>
      </div>
      <div class="card">
        <h3>账户</h3>
        <input id="old-password" type="password" placeholder="旧密码" autocomplete="current-password">
        <input id="new-password" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password">
        <input id="confirm-password" type="password" placeholder="确认新密码" autocomplete="new-password">
        <div class="row">

<script>

// Market status from browser local time (assumes Asia/Shanghai). Holidays not handled.
function marketStatusText() {
  const now = new Date();
  const day = now.getDay(); // 0 Sun .. 6 Sat
  const mins = now.getHours() * 60 + now.getMinutes();
  const weekday = day >= 1 && day <= 5;
  function cnStatus(open1, close1, open2, close2) {
    if (!weekday) return "休市";
    if (mins < open1) return "未开盘";
    if (mins < close1) return "盘中";
    if (mins < open2) return "午休";
    if (mins < close2) return "盘中";
    return "已收盘";
  }
  const a = cnStatus(570, 690, 780, 900);   // A股 09:30-11:30, 13:00-15:00
  const hk = cnStatus(570, 720, 780, 960);  // 港股 09:30-12:00, 13:00-16:00
  // 美股 sessions computed in ET (America/New_York, DST-aware); reuse per-fund session logic
  const usSess = marketSession("us", now);
  const us = usSess === "trading" ? "盘中" : usSess === "pre" ? "盘前" : (usSess === "post" || usSess === "postext") ? "盘后"

}

// Per-fund market status from holdings codes: 6-digit=A股, 5-digit=港股, alphabetic=美股.
// A/HK sessions by browser local time, Mon-Fri only, holidays ignored.
// US sessions computed in ET via Intl (DST-aware), Mon-Fri ET, holidays ignored.
const ET_FMT = new Intl.DateTimeFormat("en-US", {
  timeZone: "America/New_York", weekday: "short",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23"
});

  const parts = {};
  ET_FMT.formatToParts(now).forEach(p => { parts[p.type] = p.value; });
  const wd = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return { day: wd[parts.weekday], mins: parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10) };

function marketOfCode(code) {
  const c = String(code || "").trim();
  if (/^\d{6}$/.test(c)) return "a";
  if (/^\d{5}$/.test(c)) return "hk";
  if (/^[A-Za-z]/.test(c)) return "us";
  return null;
}
function marketSession(market, now) {
  const day = now.getDay(); // 0 Sun .. 6 Sat
  const mins = now.getHours() * 60 + now.getMinutes();
  const weekday = day >= 1 && day <= 5;
  if (market === "a") { // 09:30-11:30, 13:00-15:00
    if (!weekday) return "closed";
    if (mins < 570) return "preopen";
    if (mins < 690) return "trading";
    if (mins < 780) return "lunch";
    if (mins < 900) return "trading";
    return "closed";
  }
  if (market === "hk") { // 09:30-12:00, 13:00-16:00
    if (!weekday) return "closed";
    if (mins < 570) return "preopen";
    if (mins < 720) return "trading";
    if (mins < 780) return "lunch";
    if (mins < 960) return "trading";
    return "closed";
  }
  if (market === "us") { // ET Mon-Fri: pre 04:00-09:30, trading 09:30-16:00, post 16:00-20:00; 20:00 -> next 04:00 (incl. weekends) is "postext" (last post price reused, not a live session)
    const et = etParts(now);

      if (et.mins >= 570 && et.mins < 960) return "trading";
      if (et.mins >= 960 && et.mins < 1200) return "post";

function fundMarketStatus(f, now) {

  for (const p of ["trading", "pre", "post", "postext", "lunch", "preopen"]) {
    if (sessions.includes(p)) { s = p; break; }
  }
  const label = markets.has("us")
    ? (s === "trading" ? "盘中" : s === "pre" ? "盘前" : (s === "post" || s === "postext") ? "盘后" : s === "lunch" ? "午休" : s === "preopen" ? "未开盘" : "已收盘")
    : (s === "trading" ? "盘中交易" : s === "lunch" ? "午休" : s === "preopen" ? "未开盘" : "已收盘");

  // the estimate is always 预估; 已确认 belongs to the published NAV/change row.
  return { session: s, label, state: "预估" };

// Last trading day (Mon-Fri, holidays ignored): today if weekday and >=09:30,
// previous weekday if before 09:30, last Friday on weekend.
function lastTradingDay(now) {
  now = now || new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const mins = now.getHours() * 60 + now.getMinutes();
  if (!(d.getDay() >= 1 && d.getDay() <= 5 && mins >= 570)) {
    do { d.setDate(d.getDate() - 1); } while (!(d.getDay() >= 1 && d.getDay() <= 5));
  }
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
// Previous trading day (Mon-Fri, holidays ignored) before a YYYY-MM-DD date.
function prevTradingDay(dateStr) {
  const [y, m, d] = String(dateStr).split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  do { dt.setDate(dt.getDate() - 1); } while (!(dt.getDay() >= 1 && dt.getDay() <= 5));
  const p = n => String(n).padStart(2, "0");
  return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
}
// Funds holding overseas markets (QDII etc.) publish NAV T-1: any top-10

// freshest expected NAV date is the trading day before lastTradingDay().
function expectedNavDate(f) {
  const parts = marketBreakdown(f);
  const overseas = !!parts && parts.some(x => x.market !== "A股");
  return overseas ? prevTradingDay(lastTradingDay()) : lastTradingDay();
}
function updateFundStatuses() {
  if (!currentFunds.length) return;
  const now = new Date();
  currentFunds.forEach(f => {
    const st = fundMarketStatus(f, now);
    document.querySelectorAll('.fc-status[data-code="' + f.fund_code + '"]').forEach(el => { el.textContent = st.label; });

  });

/* ---- ranking view (v1.11.0) ---- */
let rankBoard = "returns", rankPeriod = "1y";
const rankMem = {};  // in-memory cache per board+period for this session
const PERIOD_KEY = { daily: "daily", "1w": "w1", "1m": "m1", "3m": "m3", "6m": "m6", "1y": "y1", ytd: "ytd" };
function fmtLocalTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function rankRow(it, valHtml, sub) {

const RANK_NOTES = {
  returns: "东方财富全市场基金（约 2 万只），按所选周期涨幅从高到低取前 30",
  us: "QDII 基金（225 只）中，按最新披露前十大持仓的美股占比从高到低取前 30；前十大覆盖率低于 5% 的不入榜",

function updateRankNote(poolSize) {
  $("rank-note").textContent = rankBoard === "vol"

    : (RANK_NOTES[rankBoard] || "");
}
function renderRank(data) {
  updateRankNote(data.pool_size);

    const key = PERIOD_KEY[rankPeriod];

let rankPollTimer = null, rankPollCount = 0;
function stopRankPoll() { if (rankPollTimer) { clearTimeout(rankPollTimer); rankPollTimer = null; } rankPollCount = 0; }

async function loadRank() {
  stopRankPoll();

  const cacheKey = rankBoard === "returns" ? "returns:" + rankPeriod : rankBoard;
  $("rank-err").textContent = "";

async function fetchRank(cacheKey) {

function fmtPct(v) { if (v == null) return "-"; const s = (v > 0 ? "+" : "") + v.toFixed(2) + "%"; return `<span class="${v > 0 ? "up" : v < 0 ? "down" : "flat"}">${s}</span>`; }
// Estimate accuracy vs published change (percentage points, neutral color)
function fmtDiff(v) { if (v == null) return "-"; return (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
function estDiff(f) { if (f.est_change_pct == null || f.jzzzl == null) return null; return f.est_change_pct - f.jzzzl; }
// Classify a holding code into its market: 6-digit numeric = A股, 5-digit
// numeric = 港股, 12-char ISIN by country prefix (JP日股 TW台股 KR韩股 HK港股
// US美股 CN A股, other prefix 其他）, alphabetic ticker = 美股， else 其他
// (e.g. 4-digit numeric is ambiguous JP/TW).
function marketOfHolding(code) {
  const c = String(code || "").trim().toUpperCase();
  if (/^\d{6}$/.test(c)) return "A股";
  if (/^\d{5}$/.test(c)) return "港股";
  if (/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(c)) {
    return { JP: "日股", TW: "台股", KR: "韩股", HK: "港股", US: "美股", CN: "A股" }[c.slice(0, 2)] || "其他";
  }
  if (/^[A-Z][A-Z.\-]*$/.test(c)) return "美股";
  return "其他";
}
// Market mix of top-10 holdings, broken down by market (incl. A股).
// Denominator is total top-10 weight. Returns parts [{ market, pct }]
// sorted desc by share, only pct > 0.
function marketBreakdown(f) {
  const hs = f.holdings || [];
  if (!hs.length) return null;
  let total = 0;
  const byMarket = {};
  hs.forEach(h => {
    const w = Number(h.weight);
    if (!isFinite(w)) return;
    total += w;
    const m = marketOfHolding(h.code);
    byMarket[m] = (byMarket[m] || 0) + w;
  });
  if (!(total > 0)) return null;
  return Object.keys(byMarket)
    .map(m => ({ market: m, w: byMarket[m], pct: Math.round(byMarket[m] / total * 1000) / 10 }))
    .filter(x => x.pct > 0)
    .sort((a, b) => b.w - a.w);
}
// Meta-line segment, e.g. 「美股 54.2% · A股 16.6% · 日股 15.2% · 港股 14.0%」
function marketText(f) {
  const parts = marketBreakdown(f);
  if (!parts || !parts.length) return null;
  return parts.map(x => `${x.market} ${x.pct.toFixed(1)}%`).join(" · ");
}
// After today's NAV publishes, backend est_nav is based on latest dwjz (would double-count);
// recompute estimate from previous day's NAV instead.
function estNavFromPrev(f) {
  if (f.prev_dwjz != null && f.est_change_pct != null) return (f.prev_dwjz * (1 + f.est_change_pct / 100)).toFixed(4);
  return f.est_nav ?? "-";
}
function estNavExtFromPrev(f) {
  if (f.prev_dwjz != null && f.est_change_pct_ext != null) return (f.prev_dwjz * (1 + f.est_change_pct_ext / 100)).toFixed(4);
  return f.est_nav_ext ?? "-";
}
// Extended-hours estimate row (US holdings, pre/post prices); empty when the
// backend has no ext estimate (no US holdings / US regular session / no data).
function extRow(f, published) {
  if (f.est_change_pct_ext == null) return "";

  const nav = published ? estNavExtFromPrev(f) : (f.est_nav_ext ?? "-");
  return `<div class="fc-row"><span class="fc-label">${label}</span><span class="fc-val"><b>${nav}</b> ${fmtPct(f.est_change_pct_ext)}</span></div>`;

// Intraday estimate sparkline: series from /api/history/today (backend records
// one est_change_pct point per fund per minute, downsampled to 5-min buckets).
let historySeries = {};
async function loadHistory() {
  try {
    const data = await api("/api/history/today");
    if (data && data.series && typeof data.series === "object") historySeries = data.series;
  } catch { /* sparkline is optional; keep previous series, never break cards */ }
}
function fmtHM(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes());
}
function sparklineHtml(code) {
  const pts = historySeries[code];
  if (!Array.isArray(pts) || pts.length < 2) return "";
  const vals = pts.map(p => p[1]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const crossesZero = min < 0 && max > 0;
  let lo = min, hi = max;
  if (hi === lo) { lo -= 0.1; hi += 0.1; }  // flat series: avoid div0
  const pad = (hi - lo) * 0.1;
  lo -= pad; hi += pad;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const tSpan = t1 - t0;
  const W = 100, H = 44, YT = 2, YB = 42;
  const X = (p, i) => tSpan > 0 ? (p[0] - t0) / tSpan * W : i / (pts.length - 1) * W;
  const Y = v => YB - (v - lo) / (hi - lo) * (YB - YT);
  const line = pts.map((p, i) => X(p, i).toFixed(2) + "," + Y(p[1]).toFixed(2)).join(" ");
  const area = "0," + H + " " + line + " " + W + "," + H;
  const last = vals[vals.length - 1];
  const color = last >= 0 ? "#C9362B" : "#07845B";
  const zero = crossesZero
    ? `<line x1="0" y1="${Y(0).toFixed(2)}" x2="${W}" y2="${Y(0).toFixed(2)}" stroke="#D0D5DD" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`
    : "";
  const fmtLbl = v => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
  return `<div class="fc-spark">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="${area}" fill="${color}" opacity="0.08"/>${zero}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <span class="sp-max">${fmtLbl(max)}</span>
    <span class="sp-min">${fmtLbl(min)}</span>
    <div class="sp-times"><span>${fmtHM(t0)}</span><span>${fmtHM(t1)}</span></div>
  </div>`;
}
let refreshing = false, prevSnapshot = null, currentFunds = [], currentGroups = [], sortMode = "default", fadeTimer = null;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function catOptions(current, allCats) {
  const opts = ['<option value=""' + (current ? "" : " selected") + ">未分类</option>"];
  allCats.forEach(c => opts.push(`<option value="${esc(c)}"${c === current ? " selected" : ""}>${esc(c)}</option>`));
  opts.push('<option value="__new__">＋新分类</option>');
  return opts.join("");
}
function buildGroups(data) {
  const funds = data.funds || [];
  const cats = data.categories || [...new Set(funds.map(f => f.category || "").filter(Boolean))];
  currentFunds = funds;
  // Groups follow category order; uncategorized always last
  currentGroups = [];
  cats.forEach(cat => {
    const items = funds.filter(f => (f.category || "") === cat);
    if (items.length) currentGroups.push({ category: cat, items });
  });
  const uncat = funds.filter(f => !(f.category || ""));
  if (uncat.length) currentGroups.push({ category: "", items: uncat });
  return cats;
}
function sortedItems(items) {
  if (sortMode !== "change") return items;
  return [...items].sort((a, b) => (b.est_change_pct ?? -Infinity) - (a.est_change_pct ?? -Infinity));
}
function renderFunds(data) {
  const funds = data.funds || [];
  buildGroups(data);
  const changed = new Set();
  if (prevSnapshot) {
    funds.forEach(f => {
      const p = prevSnapshot[f.fund_code];
      if (p && (p.est_nav !== f.est_nav || p.est_change_pct !== f.est_change_pct || p.est_nav_ext !== f.est_nav_ext || p.est_change_pct_ext !== f.est_change_pct_ext || p.dwjz !== f.dwjz)) changed.add(f.fund_code);
    });
  }
  let html = "";
  currentGroups.forEach(g => {
    // Precompute per-fund status/published/big-change so the group header can
    // show count + average of the same big change each card displays.
    const metas = sortedItems(g.items).map(f => {
      const st = fundMarketStatus(f);
      // Published once the NAV date reaches the expected date (>= also covers
      // funds with overseas holdings that still publish same-day, e.g. 005827).
      const published = !!f.nav_date && f.nav_date >= expectedNavDate(f);
      const live = !["closed", "preopen", "lunch"].includes(st.session);
      return { f, st, published, live, big: (published && !live) ? f.jzzzl : f.est_change_pct };
    });
    const vals = metas.map(m => m.big).filter(v => v != null && isFinite(v));
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    const stats = avg != null
      ? `<span class="gt-count">${g.items.length}只</span> · 均 ${fmtPct(avg)}`
      : `<span class="gt-count">${g.items.length}只</span>`;
    html += `<div class="group-title"><span class="gt-bar${g.category ? "" : " gt-bar-gray"}"></span><span class="gt-name">${esc(g.category || "未分类")}</span><span class="gt-stats">${stats}</span></div>`;
    metas.forEach(({ f, st, published, live, big }) => {
      const ch = changed.has(f.fund_code);
      const ov = marketText(f);
      // Official NAV for the expected date already published:

      const rows = (published && !live)
        ? `<div class="fc-row fc-row-today"><span class="fc-label">今日净值（${f.nav_date ?? ""}）</span><span class="fc-val"><b>${f.dwjz ?? "-"}</b> ${fmtPct(f.jzzzl)}<span class="fc-pub">已确认</span></span></div>
        ${f.prev_dwjz != null ? `<div class="fc-row fc-row-prev"><span class="fc-label">前一交易日净值（${f.prev_nav_date ?? ""}）</span><span class="fc-val">${f.prev_dwjz} ${fmtPct(f.prev_jzzzl)}</span></div>` : ""}
        <div class="fc-row"><span class="fc-label">自算估值</span><span class="fc-val"><b>${estNavFromPrev(f)}</b> ${fmtPct(f.est_change_pct)}<span class="fc-state">预估</span></span></div>
        ${extRow(f, true)}
        <div class="fc-row fc-row-diff"><span class="fc-label">估值偏差</span><span class="fc-val fc-diff">${fmtDiff(estDiff(f))}</span></div>`
        : published
        ? `<div class="fc-row fc-row-today"><span class="fc-label">今日净值（${f.nav_date ?? ""}）</span><span class="fc-val"><b>${f.dwjz ?? "-"}</b> ${fmtPct(f.jzzzl)}<span class="fc-pub">已确认</span></span></div>
        ${f.prev_dwjz != null ? `<div class="fc-row fc-row-prev"><span class="fc-label">前一交易日净值（${f.prev_nav_date ?? ""}）</span><span class="fc-val">${f.prev_dwjz} ${fmtPct(f.prev_jzzzl)}</span></div>` : ""}
        <div class="fc-row"><span class="fc-label">自算估值</span><span class="fc-val"><b>${f.est_nav ?? "-"}</b> ${fmtPct(f.est_change_pct)}<span class="fc-state" data-code="${f.fund_code}">${st.state}</span></span></div>
        ${extRow(f, false)}`
        : `<div class="fc-row"><span class="fc-label">昨日净值（${f.nav_date ?? ""}）</span><span class="fc-val"><b>${f.dwjz ?? "-"}</b></span></div>
        <div class="fc-row"><span class="fc-label">自算估值</span><span class="fc-val"><b>${f.est_nav ?? "-"}</b> ${fmtPct(f.est_change_pct)}<span class="fc-state" data-code="${f.fund_code}">${st.state}</span></span></div>
        ${extRow(f, false)}`;
      html += `<div class="fund-card${ch ? " changed" : ""}">
      <div class="fc-head">
        <div class="fc-name">${esc(f.fund_name)}<span class="fc-status" data-code="${f.fund_code}">${st.label}</span></div>
        ${published ? "" : `<div class="fc-chg">${fmtPct(big)}</div>`}
      </div>
      <div class="fc-meta">${ch ? '<span class="badge">已更新</span>' : ""}${f.fund_code} · 覆盖 ${f.coverage_pct}%${ov != null ? ` · ${ov}` : ""} · ${esc(f.report_label ?? "-")} ${f.report_date ?? ""}${f.stale ? " · 数据可能过期" : ""}</div>
      ${rows}
      ${sparklineHtml(f.fund_code)}
      </div>`;
    });
  });
  $("fund-cards").innerHTML = html;
  prevSnapshot = {};
  funds.forEach(f => { prevSnapshot[f.fund_code] = { est_nav: f.est_nav, est_change_pct: f.est_change_pct, est_nav_ext: f.est_nav_ext, est_change_pct_ext: f.est_change_pct_ext, dwjz: f.dwjz }; });
  // fade out change markers after 4s
  clearTimeout(fadeTimer);
  if (changed.size) {
    fadeTimer = setTimeout(() => {
      document.querySelectorAll(".fund-card.changed").forEach(el => {
        el.classList.remove("changed");
        const b = el.querySelector(".badge"); if (b) b.remove();

}

    });

async function moveFund(category, indexInGroup, dir) {
  const g = currentGroups.find(x => x.category === category);
  if (!g) return;
  const j = indexInGroup + dir;
  if (j < 0 || j >= g.items.length) return;
  const ids = g.items.map(f => f.id);
  [ids[indexInGroup], ids[j]] = [ids[j], ids[indexInGroup]];
  try { await api("/api/watchlist/reorder", { method: "POST", body: JSON.stringify({ category, ids }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function moveFundTo(category, indexInGroup, pos) {
  const g = currentGroups.find(x => x.category === category);
  if (!g) return;
  const ids = g.items.map(f => f.id);
  const [id] = ids.splice(indexInGroup, 1);
  if (pos === "top") ids.unshift(id); else ids.push(id);
  try { await api("/api/watchlist/reorder", { method: "POST", body: JSON.stringify({ category, ids }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function moveCategory(idx, dir) {
  const names = [...((window.estimateData || {}).categories || [])];
  const j = idx + dir;
  if (j < 0 || j >= names.length) return;
  [names[idx], names[j]] = [names[j], names[idx]];
  try { await api("/api/categories/reorder", { method: "POST", body: JSON.stringify({ names }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}
async function moveCategoryTo(idx, pos) {
  const names = [...((window.estimateData || {}).categories || [])];
  if (idx < 0 || idx >= names.length) return;
  const [name] = names.splice(idx, 1);
  if (pos === "top") names.unshift(name); else names.push(name);
  try { await api("/api/categories/reorder", { method: "POST", body: JSON.stringify({ names }) }); await loadEstimates(); }
  catch (e) { setErr(e.message); }
}

    if (!cat) { await loadEstimates(); return; }

async function loadEstimates() {
  if (refreshing) return;
  refreshing = true;
  resetCountdown();
  const rb = $("refresh-btn");
  rb.disabled = true; rb.classList.add("spinning");
  try {
    const histP = loadHistory();  // parallel; never rejects
    const data = await api("/api/estimates");
    window.estimateData = data;
    if (data.refresh_seconds && data.refresh_seconds !== refreshSeconds) {
      refreshSeconds = data.refresh_seconds;
      startAutoRefresh(); resetCountdown();
    }
    const funds = data.funds || [];
    addedCodes = new Set(funds.map(f => f.fund_code));
    $("empty-tip").style.display = funds.length ? "none" : "";
    if (!funds.length) $("empty-tip").textContent = "列表为空，去「设置」里搜索添加基金。";
    try { localStorage.setItem(estimatesCacheKey(), JSON.stringify(data)); } catch { /* quota/private mode */ }
    await histP;
    renderFunds(data);
    renderSettings(data);
    setErr("");
  } catch (e) { if (String(e.message).includes("登录")) showAuth(); else setErr(e.message); }
  finally { refreshing = false; rb.disabled = false; rb.classList.remove("spinning"); }
}
